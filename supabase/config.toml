project_id = "zbinwdhzquhvhbhyeqml"

# Pix creation is authenticated by the customer's Supabase JWT and revalidated in the handler.
[functions.blackcat-create-pix]
verify_jwt = true

# Blackcat cannot send a Supabase user JWT. The handler verifies the transaction
# against Blackcat's authenticated API and checks the transaction ID and amount.
[functions.blackcat-webhook]
verify_jwt = false

# Public feed returns only timestamps of paid orders, never customer or order details.
[functions.recent-purchases]
verify_jwt = false

# Capability tokens, admin JWTs, cron secret and signed provider webhooks are verified inside each handler.
[functions.recovery-carts]
verify_jwt = false
[functions.recovery-worker]
verify_jwt = false
[functions.recovery-provider-webhook]
verify_jwt = false

# Every action validates the real user JWT and admin role server-side.
[functions.tracking-email]
verify_jwt = false
